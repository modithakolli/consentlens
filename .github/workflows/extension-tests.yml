name: Extension tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  extension-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run extension fixture checks
        run: |
          node extension/test/scan-fixtures.mjs
          node extension/test/cmp-flow-fixtures.mjs
          node extension/test/storage-schema.mjs
          node extension/test/popup-risk.mjs

  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run backend tests
        working-directory: backend
        run: npm test

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Secrets detection (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
