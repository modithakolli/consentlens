<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ConsentLens Review</title><link rel="stylesheet" href="/app.css"></head><body><main><header><a href="/profiles">ConsentLens</a><a href="/review">Reviewer</a></header><h1>Reviewer console</h1><p>Use only on the private review environment. A company cannot create its own verified status.</p><label>Reviewer token <input id="reviewerToken" type="password" autocomplete="off"></label><button id="loadClaims">Load claims</button><pre id="claims"></pre><h2>Record a verification decision</h2><form id="reviewForm"><label>Domain <input name="domain" required></label><label>Status <select name="status"><option>claimed</option><option>under_review</option><option>verified</option><option>rejected</option><option>suspended</option><option>revoked</option></select></label><label>Scope <input name="scope"></label><label>Criteria version <input name="criteriaVersion" placeholder="2026.1"></label><label>Expiry date <input name="expiresAt" type="date"></label><label>Reason <textarea name="reason" required></textarea></label><button>Save review</button></form><pre id="reviewResult"></pre></main><script src="/app.js"></script></body></html>
